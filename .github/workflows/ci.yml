name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ["check-types", "lint", "test"]
      # We want a comprehensive view of checks, so let them all run even if one fails
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        # Installs the pnpm version from devEngines in package.json
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          install: false
          node-version-file: false
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          cache: "pnpm"
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all
        # The plugin packages depend on the parser. This currently works
        # incidentally, and will be improved when we use a dedicated monorepo
        # task runner.
        run: pnpm run -r build
      - run: pnpm ${{ matrix.command }}
